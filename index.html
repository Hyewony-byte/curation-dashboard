<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotte Mart ZETTA - 메인 캐러셀 실시간 매출 관제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6 font-sans">
  <div class="max-w-7xl mx-auto select-none space-y-6">
    
    <!-- 1. 헤더 영역 -->
    <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-black text-white text-xl shadow-md shadow-red-500/20">
          Z
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">LOTTE MART ZETTA</h1>
            <span id="data-status-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200">
              실제 전시 구조 매핑
            </span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">스마트센터(CFC) 메인 홈 캐러셀 실시간 결제 & 슬롯 효율 관제</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <label class="cursor-pointer flex items-center gap-2 px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-semibold shadow-sm transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <span>BO 매출 엑셀 매핑</span>
          <input type="file" id="excel-input" accept=".xlsx, .xls" class="hidden" />
        </label>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white border border-slate-200 shadow-sm text-xs font-mono">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="timer-display">11:30:00</span>
          <span class="text-slate-400 pl-2 border-l border-slate-200">5분 텀블링 윈도우</span>
        </div>
      </div>
    </div>

    <!-- 2. 캐러셀 테마 탭 선택군 -->
    <div>
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">
        전시 캐러셀 선택
      </label>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="tab-container"></div>
    </div>

    <!-- 3. 실사이트 캐러셀 프리뷰 & 실시간 슬롯 매출 카드 (핵심) -->
    <div class="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 id="current-carousel-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
            <!-- 동적 삽입 -->
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">실제 사이트 노출 순서(#1~#6)별 실시간 매출 반응 및 스와이프 성과</p>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 font-medium">가로 스크롤 캐러셀 뷰</span>
      </div>

      <!-- 실제 사이트와 동일한 가로 스크롤 카드 리스트 -->
      <div class="flex gap-4 overflow-x-auto pb-3 pt-1 scrollbar-thin" id="carousel-product-cards">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 4. KPI 카드 그리드 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="p-5 rounded-2xl bg-white border border-slate-200/90 shadow-sm">
        <span class="text-xs font-medium text-slate-500">선택 캐러셀 5분 합산 매출</span>
        <div id="kpi-total" class="mt-2 text-2xl font-black text-slate-900 font-mono">₩ 0</div>
        <div class="mt-1.5 text-xs text-emerald-600 font-medium">▲ 직전 5분 대비 +14.8%</div>
      </div>

      <div class="p-5 rounded-2xl bg-white border border-slate-200/90 shadow-sm">
        <span class="text-xs font-medium text-slate-500">구좌 내 1위 기여 상품</span>
        <div id="kpi-top" class="mt-2 text-base font-bold text-slate-900 truncate">-</div>
        <div id="kpi-top-detail" class="mt-1.5 text-xs text-red-600 font-semibold font-mono">-</div>
      </div>

      <div class="p-5 rounded-2xl bg-white border border-slate-200/90 shadow-sm">
        <span class="text-xs font-medium text-slate-500">전면 슬롯(#1~#3) 매출 집중도</span>
        <div id="kpi-front-share" class="mt-2 text-2xl font-black text-blue-600 font-mono">0%</div>
        <div class="mt-1.5 text-xs text-slate-500">첫 화면 노출 3개 상품의 매출 비중</div>
      </div>
    </div>

    <!-- 5. 시계열 차트 영역 -->
    <div class="p-6 rounded-2xl bg-white border border-slate-200/90 shadow-sm">
      <h3 class="text-base font-bold text-slate-900 mb-1">캐러셀 상위 품목 실시간 매출 곡선</h3>
      <p class="text-xs text-slate-500 mb-4">최근 20분간 5분 윈도우 매출 추이</p>
      <div class="h-60 relative">
        <canvas id="salesChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // 실제 캡처 화면 기반 데이터셋
    let SECTIONS = [
      {
        id: 'SEC_NIGHT_SNACK',
        title: '오늘도 힘차게! 응원 야식 준비',
        badge: '실제 야식 캐러셀',
        products: [
          {
            slot: 1,
            id: 'SNK_01',
            name: '머리부터 꼬리까지 통짜 장어 (1팩)',
            badge: '[제타패스 X 네이버 멤버십] 주간신상 5%',
            price: 4990,
            originPrice: null,
            img: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=300&q=80',
            sales5m: 1497000,
            orderQty: 300,
            color: '#dc2626'
          },
          {
            slot: 2,
            id: 'SNK_02',
            name: '[제타특가] 푸드렐라 순살후라이드 (1KG)',
            badge: '30% 할인',
            price: 11130,
            originPrice: 15900,
            img: 'https://images.unsplash.com/photo-1562967914-608f82629710?w=300&q=80',
            sales5m: 2337300,
            orderQty: 210,
            color: '#ea580c'
          },
          {
            slot: 3,
            id: 'SNK_03',
            name: '[놀라운가격] 제타 오미리 냉삼 구이 (1KG)',
            badge: '[행사카드] 오미리 냉삼구이 1kg 10,900원',
            price: 12900,
            originPrice: null,
            img: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=300&q=80',
            sales5m: 3225000,
            orderQty: 250,
            color: '#ca8a04'
          },
          {
            slot: 4,
            id: 'SNK_04',
            name: '하로로 해머톤 아이스컵 (350ML)',
            badge: '하로로 스텐컵 30% 할인',
            price: 10500,
            originPrice: 15000,
            img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300&q=80',
            sales5m: 630000,
            orderQty: 60,
            color: '#16a34a'
          },
          {
            slot: 5,
            id: 'SNK_05',
            name: '[제타특가] 집밥장인 참이맛 순살감자탕 블랙 (700G)',
            badge: '10% 할인',
            price: 7011,
            originPrice: 7790,
            img: 'https://images.unsplash.com/photo-1547928576-a4a33237cbc3?w=300&q=80',
            sales5m: 981540,
            orderQty: 140,
            color: '#0891b2'
          },
          {
            slot: 6,
            id: 'SNK_06',
            name: '[놀라운가격] 대패삼겹살 800g (냉동)',
            badge: '인기상품',
            price: 9900,
            originPrice: null,
            img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300&q=80',
            sales5m: 1584000,
            orderQty: 160,
            color: '#6366f1'
          }
        ]
      },
      {
        id: 'SEC_CHUSEOK_FOOD',
        title: '한가위 상차림, 꼼꼼하게 준비해요',
        badge: '시즌 신선/제수용품',
        products: [
          { slot: 1, id: 'F01', name: '[제] 호주산 곡물비육 찜갈비용 (1000g)', badge: '멤버십 40%할인', price: 32280, originPrice: 53800, img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300&q=80', sales5m: 2079188, color: '#dc2626' },
          { slot: 2, id: 'F02', name: '꼬치없이 부쳐낸 오미산적 (450g)', badge: '2개 골라담기', price: 10360, originPrice: null, img: 'https://images.unsplash.com/photo-1547928576-a4a33237cbc3?w=300&q=80', sales5m: 1090220, color: '#ea580c' },
          { slot: 3, id: 'F03', name: '제수용 사과(특) (3입/팩)', badge: '농할 20%할인', price: 14900, originPrice: null, img: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300&q=80', sales5m: 1569000, color: '#ca8a04' }
        ]
      },
      {
        id: 'SEC_CHUSEOK_GIFT',
        title: '감사의 마음을 가득 담은 한가위 선물세트',
        badge: '고단가 선물세트',
        products: [
          { slot: 1, id: 'G01', name: '[남도화우] 한우 1등급 실속 정육세트', badge: '사전예약 4만원 할인', price: 99000, originPrice: 139000, img: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=300&q=80', sales5m: 3960000, color: '#dc2626' },
          { slot: 2, id: 'G02', name: '[남도화우] 한우 1등급 등심 정육세트', badge: '사전예약 4만원 할인', price: 159000, originPrice: 199000, img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300&q=80', sales5m: 4770000, color: '#7c3aed' }
        ]
      }
    ];

    let currentSecId = SECTIONS[0].id;
    let chartInstance = null;

    function initChart() {
      const ctx = document.getElementById('salesChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: ['11:15', '11:20', '11:25', '11:30'], datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b' } },
            y: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', callback: v => '₩' + Math.round(v/10000).toLocaleString() + '만' } }
          },
          plugins: { legend: { labels: { color: '#334155', boxWidth: 12, font: { weight: 'bold' } } } }
        }
      });
    }

    function renderTabs() {
      const container = document.getElementById('tab-container');
      container.innerHTML = SECTIONS.map(sec => {
        const isSel = sec.id === currentSecId;
        const total = sec.products.reduce((a, b) => a + Number(b.sales5m || 0), 0);
        return `
          <button onclick="selectSection('${sec.id}')" class="p-3.5 rounded-xl text-left border transition-all ${
            isSel ? 'bg-red-50/50 border-red-500 shadow-sm ring-1 ring-red-500/30' : 'bg-white border-slate-200/90 hover:border-slate-300 shadow-sm'
          }">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold px-2 py-0.5 rounded text-[10px] ${
                isSel ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'
              }">${sec.badge}</span>
              <span class="text-red-600 font-bold font-mono text-xs">₩ ${Math.round(total/10000).toLocaleString()}만</span>
            </div>
            <div class="font-bold text-xs text-slate-900 mt-2 truncate">${sec.title}</div>
            <div class="text-[11px] text-slate-400 mt-0.5">전시 슬롯 ${sec.products.length}개 상품</div>
          </button>
        `;
      }).join('');
    }

    function renderCarouselView() {
      const sec = SECTIONS.find(s => s.id === currentSecId);
      const total = sec.products.reduce((a, b) => a + Number(b.sales5m || 0), 0);
      const sorted = [...sec.products].sort((a, b) => Number(b.sales5m) - Number(a.sales5m));
      const topP = sorted[0];

      // 상단 3개 전면 슬롯 매출 비중 계산
      const front3Sum = sec.products.slice(0, 3).reduce((a, b) => a + Number(b.sales5m || 0), 0);
      const frontShare = total > 0 ? Math.round((front3Sum / total) * 100) : 0;

      document.getElementById('current-carousel-title').innerHTML = `
        <span class="w-2 h-4 bg-red-600 rounded-full inline-block"></span>
        ${sec.title}
      `;
      document.getElementById('kpi-total').textContent = '₩ ' + total.toLocaleString();
      document.getElementById('kpi-top').textContent = topP ? topP.name : '-';
      document.getElementById('kpi-top-detail').textContent = topP ? `₩ ${Number(topP.sales5m).toLocaleString()} (${Math.round((topP.sales5m/total)*100)}%)` : '-';
      document.getElementById('kpi-front-share').textContent = frontShare + '%';

      // 실제 사이트와 동일한 가로 스크롤 카드 리스트 렌더링
      const cardContainer = document.getElementById('carousel-product-cards');
      cardContainer.innerHTML = sec.products.map((p, idx) => {
        const share = total > 0 ? Math.round((p.sales5m / total) * 100) : 0;
        return `
          <div class="flex-shrink-0 w-64 bg-slate-50/70 border border-slate-200 rounded-2xl p-3 flex flex-col justify-between relative hover:border-slate-300 transition-all shadow-sm">
            <!-- 슬롯 순번 배지 -->
            <div class="flex justify-between items-center mb-2">
              <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-white">#${idx + 1} 슬롯</span>
              <span class="text-xs font-bold text-red-600 font-mono">점유율 ${share}%</span>
            </div>

            <!-- 상품 이미지 & 프로모션 태그 -->
            <div class="w-full h-36 rounded-xl overflow-hidden bg-slate-200 mb-2.5 relative">
              <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover" />
            </div>

            <!-- 프로모션 배지 -->
            <div class="min-h-[22px] mb-1">
              ${p.badge ? `<span class="text-[11px] font-bold text-red-600 line-clamp-1">● ${p.badge}</span>` : ''}
            </div>

            <!-- 상품명 -->
            <div class="font-bold text-xs text-slate-900 line-clamp-2 min-h-[34px] leading-tight mb-2">
              ${p.name}
            </div>

            <!-- 가격 정보 -->
            <div class="mb-3">
              <div class="flex items-baseline gap-1.5">
                <span class="text-base font-black text-slate-900">₩ ${p.price.toLocaleString()}</span>
                ${p.originPrice ? `<span class="text-xs text-slate-400 line-through">₩${p.originPrice.toLocaleString()}</span>` : ''}
              </div>
            </div>

            <!-- 실시간 성과 지표 박스 -->
            <div class="bg-white p-2.5 rounded-xl border border-slate-200/80 text-[11px]">
              <div class="flex justify-between text-slate-500 mb-1">
                <span>5분 매출:</span>
                <span class="font-bold text-red-600 font-mono">₩ ${Math.round(p.sales5m).toLocaleString()}</span>
              </div>
              <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div class="bg-red-500 h-full rounded-full" style="width: ${share}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 시계열 차트 갱신
      chartInstance.data.datasets = sorted.slice(0, 3).map(p => ({
        label: p.name.substring(0, 14),
        data: [p.sales5m * 0.82, p.sales5m * 0.91, p.sales5m * 0.96, p.sales5m],
        borderColor: p.color || '#dc2626',
        backgroundColor: (p.color || '#dc2626') + '15',
        fill: true,
        tension: 0.35,
        borderWidth: 2
      }));
      chartInstance.update();
    }

    window.selectSection = function(id) {
      currentSecId = id;
      renderTabs();
      renderCarouselView();
    };

    // 엑셀 업로드 핸들러
    document.getElementById('excel-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const parsed = [];
        for (let i = 2; i < json.length; i++) {
          const row = json[i];
          if (!row || row[0] === '총계' || !row[11]) continue;

          parsed.push({
            slot: parsed.length + 1,
            id: row[10] || `P_${i}`,
            name: row[11] || '',
            badge: 'BO 실매출',
            price: Math.round((Number(row[21]) || 0) / (Number(row[24]) || 1)),
            originPrice: null,
            img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80',
            sales5m: Number(row[21]) || 0,
            color: '#dc2626'
          });
        }

        if (parsed.length > 0) {
          SECTIONS.unshift({
            id: 'SEC_BO_UPLOAD',
            title: `BO 엑셀 실제 매출 반영 (${file.name.substring(0, 15)}...)`,
            badge: 'BO 실데이터 매핑',
            products: parsed
          });
          currentSecId = SECTIONS[0].id;
          renderTabs();
          renderCarouselView();
          alert(`엑셀 파일에서 ${parsed.length}개 상품 실매출을 성공적으로 매핑했습니다!`);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    window.onload = function() {
      initChart();
      renderTabs();
      renderCarouselView();

      // 3.5초 주기 시뮬레이션 인터벌
      setInterval(() => {
        const now = new Date();
        document.getElementById('timer-display').textContent = now.toTimeString().split(' ')[0];
        SECTIONS.forEach(s => {
          s.products.forEach(p => {
            const inc = Math.floor(Math.random() * 2);
            p.sales5m = Math.max(100000, p.sales5m + (inc * (p.price || 5000)));
          });
        });
        renderTabs();
        renderCarouselView();
      }, 3500);
    };
  </script>
</body>
</html>
