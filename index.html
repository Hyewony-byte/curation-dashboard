<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotte Mart ZETTA - 메인 캐러셀별 실시간 매출 관제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#070b12] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip } = Recharts;

    // 실제 메인 캡처 화면 기반 캐러셀 및 상품 메타데이터
    const CAROUSEL_SECTIONS = [
      {
        id: 'SEC_CHUSEOK_FOOD',
        title: '한가위 상차림, 꼼꼼하게 준비해요',
        desc: '명절 신선/정육/제수용품 가로 캐러셀',
        badge: '시즌 기획전',
        products: [
          { id: 'F01', name: '[제] 호주산 곡물비육 찜갈비용 (1000g)', price: 32280, base5m: 1850000, color: '#ef4444' },
          { id: 'F02', name: '꼬치없이 부쳐낸 오미산적 (450g)', price: 10360, base5m: 940000, color: '#f97316' },
          { id: 'F03', name: '제수용 사과(특) (3입/팩)', price: 14900, base5m: 1420000, color: '#eab308' },
          { id: 'F04', name: '[사전예약] 모둠전 세트 (냉장)', price: 23850, base5m: 760000, color: '#22c55e' },
          { id: 'F05', name: '[사전예약] 모둠 삼색나물 (270g)', price: 8550, base5m: 520000, color: '#06b6d4' },
        ]
      },
      {
        id: 'SEC_CHUSEOK_GIFT',
        title: '감사의 마음을 가득 담은 한가위 선물세트',
        desc: '프리미엄 한우/가공/과일 선물세트 캐러셀',
        badge: '고단가 선물세트',
        products: [
          { id: 'G01', name: '[남도화우] 한우 1등급 실속 정육세트', price: 99000, base5m: 3960000, color: '#ef4444' },
          { id: 'G02', name: '[남도화우] 한우 1등급 등심 정육세트', price: 159000, base5m: 4770000, color: '#8b5cf6' },
          { id: 'G03', name: '[명절선물세트] CJ 스팸복합 S호', price: 39900, base5m: 1990000, color: '#f59e0b' },
          { id: 'G04', name: '[명절선물세트] 충주사과 천안배 (혼합)', price: 69900, base5m: 2100000, color: '#10b981' },
          { id: 'G05', name: '[명절선물세트] 동원 튜나리챔 S호', price: 59280, base5m: 1180000, color: '#3b82f6' },
        ]
      },
      {
        id: 'SEC_AD_SNACK',
        title: '광고 | 좋아하면 맛, 새로 만나는 재미',
        desc: '제과/간식/프로모션 제휴 스폰서 캐러셀',
        badge: '광고/신상품',
        products: [
          { id: 'A01', name: '해태 샌드에이스 크림라떼맛 (204g)', price: 4190, base5m: 380000, color: '#ec4899' },
          { id: 'A02', name: '해태 미니자유시간 로얄밀크티 (300g)', price: 8990, base5m: 450000, color: '#6366f1' },
          { id: 'A03', name: '해태 버터링 에스프레소 버터 (194g)', price: 5590, base5m: 290000, color: '#14b8a6' },
          { id: 'A04', name: '해태 후렌치파이 딸기 (192g)', price: 3590, base5m: 360000, color: '#f43f5e' },
          { id: 'A05', name: '해태 맛동산 벨기에화이트초코 (204g)', price: 3590, base5m: 310000, color: '#a855f7' },
        ]
      }
    ];

    function App() {
      const [selectedSectionId, setSelectedSectionId] = useState(CAROUSEL_SECTIONS[0].id);
      const [sectionData, setSectionData] = useState(CAROUSEL_SECTIONS);
      const [currentTime, setCurrentTime] = useState('10:40:00');

      // 3초마다 캐러셀 내 개별 상품들의 실시간 주문 이벤트 시뮬레이션
      useEffect(() => {
        const interval = setInterval(() => {
          const now = new Date();
          setCurrentTime(now.toTimeString().split(' ')[0]);

          setSectionData(prevSections =>
            prevSections.map(sec => ({
              ...sec,
              products: sec.products.map(p => {
                const orderCount = Math.floor(Math.random() * 3); // 무작위 주문 발생
                const delta = orderCount * p.price;
                return {
                  ...p,
                  base5m: Math.max(100000, p.base5m + (Math.random() > 0.4 ? delta : -Math.floor(delta * 0.3)))
                };
              })
            }))
          );
        }, 3000);

        return () => clearInterval(interval);
      }, []);

      // 현재 선택된 캐러셀 영역 데이터
      const currentSection = useMemo(() => {
        return sectionData.find(s => s.id === selectedSectionId) || sectionData[0];
      }, [sectionData, selectedSectionId]);

      // 현재 캐러셀의 5분 총매출 및 최고 기여 상품
      const sectionSummary = useMemo(() => {
        const total = currentSection.products.reduce((acc, p) => acc + p.base5m, 0);
        const sorted = [...currentSection.products].sort((a, b) => b.base5m - a.base5m);
        return {
          totalSales5m: total,
          topProduct: sorted[0],
          itemCount: currentSection.products.length
        };
      }, [currentSection]);

      // 시계열 추이 모의 데이터 (현재 캐러셀 상품 기준)
      const chartPoints = useMemo(() => {
        const p = currentSection.products;
        return [
          { time: '10:25', p0: p[0]?.base5m * 0.85, p1: p[1]?.base5m * 0.88, p2: p[2]?.base5m * 0.90 },
          { time: '10:30', p0: p[0]?.base5m * 0.92, p1: p[1]?.base5m * 0.95, p2: p[2]?.base5m * 0.93 },
          { time: '10:35', p0: p[0]?.base5m * 0.97, p1: p[1]?.base5m * 0.94, p2: p[2]?.base5m * 0.98 },
          { time: '10:40', p0: p[0]?.base5m, p1: p[1]?.base5m, p2: p[2]?.base5m },
        ];
      }, [currentSection]);

      return (
        <div className="p-6 font-sans max-w-7xl mx-auto select-none">
          {/* 1. 상단 글로벌 헤더 */}
          <div className="flex flex-wrap items-center justify-between gap-4 pb-5 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-xl font-bold tracking-tight text-white">LOTTE MART ZETTA</h1>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-950 text-rose-400 border border-rose-800">
                  캐러셀 구좌별 관제
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                메인 홈 테마 캐러셀 단위 실시간 매출 & 노출 슬롯 반응 분석
              </p>
            </div>

            <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-slate-300 font-mono">{currentTime}</span>
              <span className="text-slate-500 pl-2 border-l border-slate-800">5분 텀블링 윈도우</span>
            </div>
          </div>

          {/* 2. 캐러셀 구좌 탭 셀렉터 */}
          <div className="my-6">
            <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">
              모니터링할 캐러셀 영역 선택
            </label>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {sectionData.map((sec) => {
                const isSelected = sec.id === selectedSectionId;
                const secTotal = sec.products.reduce((a, b) => a + b.base5m, 0);
                return (
                  <button
                    key={sec.id}
                    onClick={() => setSelectedSectionId(sec.id)}
                    className={`p-4 rounded-2xl text-left border transition-all ${
                      isSelected
                        ? 'bg-[#131b2e] border-rose-500/80 shadow-lg shadow-rose-950/30 ring-1 ring-rose-500/40'
                        : 'bg-[#0e1422] border-slate-800/80 hover:border-slate-700 hover:bg-[#11192b]'
                    }`}
                  >
                    <div className="flex justify-between items-center text-xs">
                      <span className={`font-bold px-2 py-0.5 rounded ${
                        isSelected ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {sec.badge}
                      </span>
                      <span className="text-rose-400 font-bold font-mono">
                        ₩ {secTotal.toLocaleString()}
                      </span>
                    </div>
                    <div className="font-bold text-sm text-white mt-2.5 line-clamp-1">
                      {sec.title}
                    </div>
                    <div className="text-[11px] text-slate-400 mt-0.5">
                      전시 상품 {sec.products.length}개 실시간 추적 중
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* 3. 선택된 캐러셀 영역 KPI 카드 */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div className="p-5 rounded-2xl bg-[#0e1422] border border-slate-800/80">
              <span className="text-xs text-slate-400">선택 캐러셀 5분 합산 매출</span>
              <div className="mt-2 text-2xl font-black text-white font-mono">
                ₩ {sectionSummary.totalSales5m.toLocaleString()}
              </div>
              <div className="mt-1.5 text-[11px] text-emerald-400">
                ▲ 직전 주기 대비 +11.4% 활성화
              </div>
            </div>

            <div className="p-5 rounded-2xl bg-[#0e1422] border border-slate-800/80">
              <span className="text-xs text-slate-400">캐러셀 내 매출 1위 기여 상품</span>
              <div className="mt-2 text-base font-bold text-white line-clamp-1">
                {sectionSummary.topProduct?.name}
              </div>
              <div className="mt-1.5 text-[11px] text-rose-400 font-semibold font-mono">
                ₩ {sectionSummary.topProduct?.base5m.toLocaleString()} (점유율 {Math.round((sectionSummary.topProduct?.base5m / sectionSummary.totalSales5m) * 100)}%)
              </div>
            </div>

            <div className="p-5 rounded-2xl bg-[#0e1422] border border-slate-800/80">
              <span className="text-xs text-slate-400">구좌 노출 효율성 (CTR/전환)</span>
              <div className="mt-2 text-2xl font-black text-cyan-400 font-mono">
                13.8%
              </div>
              <div className="mt-1.5 text-[11px] text-slate-400">
                캐러셀 상품 스크롤 뷰 대비 장바구니 유입률
              </div>
            </div>
          </div>

          {/* 4. 캐러셀 상위 3개 상품 시계열 추이 라인 차트 */}
          <div className="p-6 rounded-2xl bg-[#0e1422] border border-slate-800/80 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h3 className="text-base font-bold text-white flex items-center gap-2">
                  <span className="w-2 h-4 bg-rose-500 rounded-full"></span>
                  [{currentSection.badge}] 상위 품목 실시간 매출 곡선
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">최근 20분간 5분 분절 매출 추이</p>
              </div>
              <div className="flex flex-wrap items-center gap-4 text-xs">
                {currentSection.products.slice(0, 3).map((p, idx) => (
                  <span key={p.id} className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.color }}></span>
                    <span className="text-slate-300 line-clamp-1 max-w-[140px]">{p.name.split(' ')[0]} {p.name.split(' ')[1]}</span>
                  </span>
                ))}
              </div>
            </div>

            <div style={{ width: '100%', height: 240 }}>
              <ResponsiveContainer>
                <AreaChart data={chartPoints}>
                  <XAxis dataKey="time" stroke="#475569" fontSize={11} tickLine={false} />
                  <YAxis stroke="#475569" fontSize={11} tickLine={false} tickFormatter={v => `₩${Math.round(v/10000)}만`} />
                  <Tooltip
                    contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', fontSize: '12px' }}
                    formatter={v => [`₩${Math.round(v).toLocaleString()}`, '']}
                  />
                  <Area type="monotone" dataKey="p0" stroke={currentSection.products[0]?.color || '#ef4444'} fill={currentSection.products[0]?.color || '#ef4444'} fillOpacity={0.15} strokeWidth={2} />
                  <Area type="monotone" dataKey="p1" stroke={currentSection.products[1]?.color || '#f59e0b'} fill={currentSection.products[1]?.color || '#f59e0b'} fillOpacity={0.15} strokeWidth={2} />
                  <Area type="monotone" dataKey="p2" stroke={currentSection.products[2]?.color || '#3b82f6'} fill={currentSection.products[2]?.color || '#3b82f6'} fillOpacity={0.15} strokeWidth={2} />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* 5. 선택된 캐러셀 내 상품별 매출 & 점유율 테이블 */}
          <div className="rounded-2xl bg-[#0e1422] border border-slate-800/80 overflow-hidden">
            <div className="p-4 border-b border-slate-800/80 flex justify-between items-center">
              <div>
                <h4 className="text-sm font-bold text-white">
                  "{currentSection.title}" 노출 상품 상세 기여도
                </h4>
                <p className="text-xs text-slate-400 mt-0.5">캐러셀 내 슬롯 위치(순서)별 실시간 결제 성과</p>
              </div>
              <span className="text-xs text-slate-400 font-mono">
                슬롯 수: {currentSection.products.length}개
              </span>
            </div>

            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-slate-900/60 text-slate-400 border-b border-slate-800">
                  <th className="py-3 px-4 w-16">슬롯</th>
                  <th className="py-3 px-4">전시 상품명</th>
                  <th className="py-3 px-4 text-right">판매 단가</th>
                  <th className="py-3 px-4 text-right">최근 5분 매출</th>
                  <th className="py-3 px-4 text-right">구좌 내 점유율</th>
                  <th className="py-3 px-4 text-center">전환 평가</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/60">
                {currentSection.products.map((p, idx) => {
                  const share = Math.round((p.base5m / sectionSummary.totalSales5m) * 100);
                  return (
                    <tr key={p.id} className="hover:bg-slate-900/40 transition-colors">
                      <td className="py-3 px-4 font-mono font-bold text-slate-400">
                        #{idx + 1}
                      </td>
                      <td className="py-3 px-4">
                        <div className="font-semibold text-slate-200">{p.name}</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">코드: {p.id}</div>
                      </td>
                      <td className="py-3 px-4 text-right font-mono text-slate-300">
                        ₩ {p.price.toLocaleString()}
                      </td>
                      <td className="py-3 px-4 text-right font-bold text-rose-400 font-mono">
                        ₩ {p.base5m.toLocaleString()}
                      </td>
                      <td className="py-3 px-4 text-right">
                        <div className="flex items-center justify-end gap-2">
                          <span className="font-mono text-slate-300">{share}%</span>
                          <div className="w-16 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div className="bg-rose-500 h-full rounded-full" style={{ width: `${share}%` }}></div>
                          </div>
                        </div>
                      </td>
                      <td className="py-3 px-4 text-center">
                        {share >= 25 ? (
                          <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] font-bold">
                            효자 상품
                          </span>
                        ) : share < 10 ? (
                          <span className="px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800 text-[10px] font-bold">
                            노출 교체 검토
                          </span>
                        ) : (
                          <span className="text-slate-400 text-[11px]">안정적</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
