name: Auto Crawl Zetta Main Products

on:
  # [크롤링 일시정지] 자동 주기 실행(schedule/cron) 비활성화
  # schedule:
  #   - cron: '0 */2 * * *'
  
  # 필요할 때만 GitHub 화면에서 수동으로 [Run workflow]를 눌러 테스트하는 모드로 유지
  workflow_dispatch:

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update products.json" && git push)
