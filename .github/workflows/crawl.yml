name: Auto Crawl Zetta Main Products

on:
  schedule:
    # 매 2시간마다 자동 실행 (UTC 기준)
    - cron: '0 */2 * * *'
  # GitHub 화면에서 수동으로 [Run workflow] 버튼을 눌러 즉시 실행 가능
  workflow_dispatch:

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # products.json 자동 커밋 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update products.json" && git push)
